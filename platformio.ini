; HID Switcher: native USB input and three persistent BLE connections.

[env:esp32s3_usb_ble]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:scripts/usb-diagnostics.py
monitor_speed = 115200
upload_speed = 460800

; Build flags for native USB Host mode
; USB CDC disabled because USB port is in host mode
build_unflags = 
    -std=gnu++11
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

build_flags = 
    -std=gnu++17
    -Wl,--wrap=ble_hs_tx_data
    -Wl,--wrap=ble_hs_hci_evt_process
    -Wl,--wrap=usbh_dev_submit_ctrl_urb
    -DCORE_DEBUG_LEVEL=1
    -DMYNEWT_VAL_BLE_SM_MAX_PROCS=3
    -DMYNEWT_VAL_BLE_STORE_MAX_CCCDS=24
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    ; USB HID driver is vendored in lib/ with the multi-device lookup fix.
    ; BLE transport and structured diagnostics.
    h2zero/NimBLE-Arduino @ 2.5.1
    bblanchon/ArduinoJson @ 7.4.2

lib_ldf_mode = deep

; Freenove ESP32-S3: 16 MB flash, 8 MB OPI PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = hid_switcher_partitions.csv

; Monitor filters for exception decoding
monitor_filters = esp32_exception_decoder

; Rebuild the USB host stack with actual hub support (not only an application macro).
custom_sdkconfig = file://sdkconfig.hub.defaults

board_build.extra_flags =
    -DARDUINO_ESP32S3_DEV
    -DARDUINO_USB_MODE=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=1
    -DBOARD_HAS_PSRAM

; Experimental companion-free, one-display-per-computer absolute mouse.
; Separate build only: the normal environment remains relative.
[env:esp32s3_usb_ble_absolute]
extends = env:esp32s3_usb_ble
build_flags =
    ${env:esp32s3_usb_ble.build_flags}
    -DHID_ABSOLUTE_POINTER=1
    -DHID_ABSOLUTE_GAIN_X=16
    -DHID_ABSOLUTE_GAIN_Y=16

; Diagnostic NanoKVM-style absolute mouse only. Uses existing calibration.
; No relative report, recalibration, horizontal pan, or buttons 6-8.
[env:esp32s3_usb_ble_absolute_only]
extends = env:esp32s3_usb_ble_absolute
build_flags =
    ${env:esp32s3_usb_ble_absolute.build_flags}
    -DHID_ABSOLUTE_ONLY_TEST=1

; Experimental BLE keyboard / relative-pointer input, plus three computer slots.
[env:esp32s3_ble_input]
extends = env:esp32s3_usb_ble_absolute
custom_sdkconfig = file://sdkconfig.ble-input.defaults
build_flags =
    ${env:esp32s3_usb_ble_absolute.build_flags}
    -DHID_BLE_INPUT=1
