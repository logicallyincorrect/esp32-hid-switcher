name: macOS CLI

on:
  pull_request:
    paths: ['cli/**', '.github/workflows/cli.yml']
  push:
    branches: [main]
    paths: ['cli/**', '.github/workflows/cli.yml']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to build and attach assets to (blank: build only)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
          persist-credentials: false
      - name: Build and check CLI
        env:
          CLI_VERSION: ${{ github.event.release.tag_name || inputs.release_tag || 'dev' }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          sh cli/build.sh
          sh cli/test.sh
      - name: Package CLI
        env:
          CLI_ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist/package
          cp cli/build/hid-switcher cli/README.md dist/package/
          tar -czf "dist/hid-switcher-macos-$CLI_ARCH.tar.gz" -C dist/package hid-switcher README.md
          cd dist
          shasum -a 256 "hid-switcher-macos-$CLI_ARCH.tar.gz" > "hid-switcher-macos-$CLI_ARCH.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: hid-switcher-macos-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hid-switcher-macos-*
          merge-multiple: true
          path: dist
      - name: Attach CLI packages to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 --clobber
