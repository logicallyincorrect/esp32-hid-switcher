name: macOS companion

on:
  push:
    branches: [main]
    paths:
      - 'companion/**'
      - '.github/workflows/companion-macos.yml'
  pull_request:
    paths:
      - 'companion/**'
      - '.github/workflows/companion-macos.yml'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build universal macOS app
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test companion
        run: sh companion/test.sh
      - name: Build and package Intel and Apple Silicon app
        run: sh companion/build.sh
      - name: Verify extracted app and checksum
        run: |
          sh companion/verify-package.sh
          cd companion/build
          shasum -a 256 HID-Switcher-Companion-macOS.zip > HID-Switcher-Companion-macOS.zip.sha256
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: HID-Switcher-Companion-macOS
          path: |
            companion/build/HID-Switcher-Companion-macOS.zip
            companion/build/HID-Switcher-Companion-macOS.zip.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attach app to GitHub release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: HID-Switcher-Companion-macOS
          path: dist
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/HID-Switcher-Companion-macOS.zip \
            dist/HID-Switcher-Companion-macOS.zip.sha256 --clobber
